services:

  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports: [ "5432:5432" ]
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [ "./data:/app/data" ]

volumes:
  postgres_data:

